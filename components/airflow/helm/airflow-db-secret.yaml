# Secret for the CloudNativePG airflow-db cluster
# CNPG uses this to bootstrap the 'airflow' database user.
# Change the password before deploying to production!
#
# To generate a strong password:
#   openssl rand -base64 24
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-db-credentials
  namespace: airflow
type: kubernetes.io/basic-auth
stringData:
  username: airflow
  password: "airflow-db-password-change-me"
