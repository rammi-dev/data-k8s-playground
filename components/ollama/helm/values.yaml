# Ollama Playground Values — 0.18.0 Schema
# Single replica, CPU-only (no GPU on minikube Hyper-V)

ollama:
  # Root level fields in the sub-chart
  replicaCount: 1

  image:
    repository: ollama/ollama
    pullPolicy: IfNotPresent
    # tag: "0.18.0" # Optional, defaults to appVersion

  # Persistence on Ceph RBD for model storage
  persistence:
    enabled: true
    storageClassName: ceph-block
    size: 20Gi

  # Service
  service:
    type: ClusterIP
    port: 11434

  # Sub-key specifically for Ollama parameters in the 0.18.0 chart
  ollama:
    # No GPU
    gpu:
      enabled: false

    # List of models to pull at container startup
    models:
      - tinyllama
      - nomic-embed-text

  # Resources
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "4"
      memory: 4Gi

  # Liveness/readiness
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 5
