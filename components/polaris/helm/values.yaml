# Apache Polaris Helm Values
# Configured for PostgreSQL persistence via CloudNativePG

polaris:
  # Persistence configuration - use PostgreSQL via JDBC
  persistence:
    type: relational-jdbc
    relationalJdbc:
      secret:
        name: polaris-jdbc-credentials
        jdbcUrl: jdbcUrl
        username: username
        password: password

  # Bootstrap init container — creates DB schema + root principal on first deploy
  # Idempotent: skips if already bootstrapped (safe to re-run)
  # Uses the admin-tool image (separate from the server image)
  extraInitContainers:
    - name: bootstrap
      image: apache/polaris-admin-tool:latest
      args:
        - bootstrap
        - -r
        - POLARIS
        - -c
        - POLARIS,root,s3cr3t
        - --print-credentials
      env:
        - name: polaris.persistence.type
          value: relational-jdbc
        - name: quarkus.datasource.jdbc.url
          valueFrom:
            secretKeyRef:
              name: polaris-jdbc-credentials
              key: jdbcUrl
        - name: quarkus.datasource.username
          valueFrom:
            secretKeyRef:
              name: polaris-jdbc-credentials
              key: username
        - name: quarkus.datasource.password
          valueFrom:
            secretKeyRef:
              name: polaris-jdbc-credentials
              key: password

  # Service configuration
  service:
    type: ClusterIP
    port: 8181

  # Resource management
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi
